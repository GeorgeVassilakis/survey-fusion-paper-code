  analytic_images: true
  analytic_spectra: true
  sparse_splat_gradients: true
  splat_flux_l1: 0.0
  checkpoint_rng_state: true
  checkpoint_gauge_sidecar: false
  position_lr_multiplier: 0.1
  position_lr_horizon: 30000
  refine:
    enabled: true
    start: 500
    stop: 15000
    every: 100
    grow_target_frac: 0.3
    grow_scale: 0.0
    prune_peak_sb_frac: 0.005
    prune_band_snr: true
    prune_band_snr_sigma: 1.0e-08
    prune_axis_ratio: null
    pair_n_sigma: 8.0
    gauge_projection: false
    birth:
      enabled: false
    max_splats: 10000000
    lifecycle_statistics: fitted_images
  fixed_holdout_eval_every_n_steps: 2500
  checkpoint_every_n_steps: 50000
  checkpoint_retain_every_n_steps: 0
  checkpoint_retain_every_n_epochs: 1
  # The end of growth and of the position-rate decay.
  checkpoint_retain_steps: [500, 15000, 30000]
  checkpoint_archive_dir: null
  checkpoint_keep_local: 0
  checkpoint_archive_drain_timeout_s: 600.0

postprocess:
  # Paper runs are scored by the evaluation scripts, not train-mode
  # postprocessing; the limits below bound eval mode.
  enabled: false
  diagnostic_outputs: [total]
  profile_timing: true
  deterministic_supersample: 1
  deterministic_chunk_size: 16384
  max_exposures: 1
  max_fiber_spectra: 12
  plot_sed_sample_locations: false

logging:
  epoch_log_every: 100
  speed:
    enabled: true
    log_every_n_steps: 10
    flush_every_records: 5
  wandb:
    enabled: false
    project: Survey Fusion
    entity: null
    run_name: ${run.run_name}
    mode: online
    watch_model: false
    save_code: false
    log_every_n_steps: 1
    region_grid_every_n_steps: 0
    log_artifacts: false

hydra:
  run:
    dir: .
  output_subdir: null
