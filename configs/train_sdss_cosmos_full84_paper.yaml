# Canonical training recipe; select seed 123 with train_paper.yaml. Every number is either
# derived from the data or stated as a hyperparameter:
#  - the objective is divided by the fitted datum count, and each spectral bin
#    is weighted spectral_bin_weight times an image pixel;
#  - the budget is a whole number of epochs (fitted pixels / pixel batch);
#  - a checkpoint is kept at every epoch boundary and at the schedule events.
# Every science key is a literal, never an environment interpolation. Keys
# marked ??? are machine-specific paths the launch must supply; train.py
# refuses to start while any is missing.
defaults:
  - data: sdss_cosmos_full84
  - model: splat
  - physics/bandpass_no_holdout
  - calibration: sdss
  - paths: default
  - platform: cuda
  - _self_

mode: train

checkpoint:
  path: null

eval:
  recompute_predictions: true
  predictions_path: null
  source_predictions_path: null
  allow_operator_reinterpretation: false

run:
  run_name: full84_paper
  seed: 42
  device: auto
  append_timestamp: true
  use_outdir_directly: false

resume:
  path: null
  model_only: false

data:
  # One prepared store for every model seed, loaded and never built (build it
  # with scripts/prepare_data.py). The digest keys the observation paths too:
  # override it together with them on another machine.
  prepare_seed: 42
  expected_prepared_digest: b6c784cfeb936bc04e8fa5efbadb8e36b64f196b94ac91db6db04acbe38fed49
  prepared_dir: ???
  datum_spill_dir: null
  random_holdout:
    fraction: 0.02
    seed: 20260723
  spectral_response_mode: metadata
  spectral_lsf_sampling: native
  spectral_response_missing_policy: error
  spectral_response_metadata_path: ???
  spectral_flux_system: sdss_imaging

calibration:
  spectral_nuisance:
    enabled: false

trainer:
  kernel_samples_k: 32
  replica_samples_k: 16
  epochs: 11
  max_steps: 0
  # Base rate of the spectral calibration factors, which are off here.
  learning_rate: 0.0005
  beta1: 0.9
  beta2: 0.999
  adam_eps: 1.0e-08
  eval_interval: 100
  grad_clip: 1.0
  validate_kernel_samples: false
  band_loss_log_every_n_steps: 0
  pixel_batch_size: 10000
  spec_batch_size: 64
  spectral_bin_weight: 5.0
  image_importance_sampling:
    enabled: true
    max_importance_weight: 20.0
  dataloader_drop_last: true
  psf_model: eigen_mog
  allow_psf_model_change: false
  eigen_mog_sidecar: ???
  eigen_mog_support_radius: 18
  eigen_mog_compute_dtype: float64
  eigen_mog_execution: cached
  image_variance: poisson_current
  image_variance_outlier_pull: 10.0
  image_pixel_mask: ???
  field_overlap_table: ???
  # Withheld from the objective: two exposures per band and the 89 test
  # spectra of the fixed split.
  exclude_exposure_labels:
    - g-001462-4-0166
    - r-001907-3-0188
