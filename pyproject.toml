[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-fusion-paper-code"
version = "0.1.0"
description = "Archival research implementation accompanying Spectro-Spatial Survey Fusion"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Georgios N. Vassilakis"}, {name = "Miles Cranmer"}, {name = "Vasily Belokurov"}]
dependencies = ["astropy>=6", "hydra-core>=1.3", "matplotlib>=3.8", "numpy>=2.3,<2.4", "omegaconf>=2.3", "pandas>=2.2", "scipy>=1.11", "torch>=2.2", "tqdm>=4.66", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
cuda = ["triton>=3; platform_system == 'Linux'"]

[project.urls]
Repository = "https://github.com/GeorgeVassilakis/survey-fusion-paper-code"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110
